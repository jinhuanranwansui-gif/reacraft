name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: unit tests
        run: node --test
      - name: built-in end-to-end selftest
        run: node src/cli.mjs selftest
      - name: probe reports engines without them
        run: node src/cli.mjs probe --json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: syntax check every module
        run: |
          find src dsh -type f \( -name '*.mjs' -o -name '*.js' \) -print0 | while IFS= read -r -d '' f; do node --check "$f"; done
      - name: the plugin entry must load without DSH present
        run: node -e "import('./dsh/host/index.js').then(m=>{if(m.name!=='reacraft')process.exit(1);console.log('host exports ok')})"
      - name: no dependency was added
        run: node -e "const p=require('./package.json');if(p.dependencies&&Object.keys(p.dependencies).length)process.exit(1);console.log('zero dependencies')"
